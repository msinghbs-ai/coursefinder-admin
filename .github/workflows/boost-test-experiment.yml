# Boost test project experiment (S2 - BOOST; Platform Admin 17 Nov 2026 22:05: database and test-project runs go through GitHub Actions and the
# Management API, with no confirmation prompt). What a run does:
#   1. Production, read only (read_only=true): migration head, G3 (75 functions, 48 relations, no drift) and the md5 of security.boost_promote_v1.
#   2. Test project coursefinder-boost-test (refused for any other project): copy the promotion function from production, then either
#      (admitted-count) optionally re-seed the cohort (docs/paste/boost-test-reseed.sql), run sql/boost-experiments/admitted-count.sql under
#      the given label and give a verdict, or (benchmark) replay the production model benchmark run named by the label: each model's answers
#      are promoted with only that model qualified, on the test project only, and reported per model and country.
#   3. Results to the never-merged branch boost-experiment/<run id> (counts and timings only).
# Nothing is written to production.
name: Boost test project experiment
on:
  workflow_dispatch:
    inputs:
      test_project_ref:
        description: "Ref of the throwaway project named coursefinder-boost-test"
        required: true
        default: "ucdaaqrpgcldnatavmib"
      label:
        description: "Run label (lower-case letters, digits, hyphens), for example run-2"
        required: true
      reseed:
        description: "Re-seed the cohort first (after a rebuild of the test project)"
        type: boolean
        default: true
      mode:
        description: "admitted-count: the load and promotion run. benchmark: replay the production model benchmark run named by the label"
        type: choice
        options: ["admitted-count", "benchmark"]
        default: "admitted-count"
concurrency:
  group: boost-test-project
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ inputs.test_project_ref }}
      PROD: fxcwkweaxjtknorudmwp
      LABEL: ${{ inputs.label }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: 1. Production, read only
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set on this repository"; exit 1; fi
          python3 scripts/boost-experiment.py prodcheck | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 2. Re-seed the cohort on the test project
        if: ${{ inputs.reseed && inputs.mode != 'benchmark' }}
        run: python3 scripts/boost-experiment.py run docs/paste/boost-test-reseed.sql "$LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 3. Promotion function from production
        run: |
          set -euo pipefail
          python3 scripts/boost-experiment.py copyfn "security.boost_on_demand_v1(timestamp with time zone)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/boost-experiment.py copyfn "security.boost_promote_v1(text,boolean,timestamptz)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 4. The experiment and its verdict
        if: ${{ inputs.mode != 'benchmark' }}
        run: |
          set -euo pipefail
          python3 scripts/boost-experiment.py run sql/boost-experiments/admitted-count.sql "$LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/boost-experiment.py verdict "$LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 4. Replay of the production model benchmark
        if: ${{ inputs.mode == 'benchmark' }}
        run: python3 scripts/boost-experiment.py benchmark "$LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Results to boost-experiment/<run id>
        if: ${{ always() }}
        run: |
          if [ ! -d out ] || [ -z "$(ls -A out 2>/dev/null)" ]; then echo "No results to keep" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="boost-experiment/${{ github.run_id }}"
          mkdir -p boost-experiment && cp -r out/* boost-experiment/ && rm -rf out
          git checkout -q -b "$branch"; git add -A boost-experiment
          git commit -q -m "Boost test project experiment results (run ${{ github.run_id }}, label $LABEL, target $REF)"
          git push -q origin "$branch"
          echo "Results branch: $branch" | tee -a "$GITHUB_STEP_SUMMARY"
