# Boost test project rebuild and harness. CF-247 Boost (Platform Admin 16 Nov 2026 21:09 and 22:44; docs/platform/CF-WORKER-BOOST-AND-PROD-LAUNCH.md §8, §12).
# Route: schema dump, reference data, then newer migrations. Run 43851316573 showed that replaying production's 2,046 migrations cannot
# rebuild it (from 13 Aug 2026 migrations assume data the pipeline loaded at run time), so the test project is built the way a production
# launch would be:
#   1. Reset the throwaway test project: unschedule its cron jobs and drop every application schema (refused unless it is named
#      coursefinder-boost-test and is neither production nor coursefinder-demo).
#   2. Schema: Pilot's baseline roles and preamble, the production schema dump of a Pilot db-schema-dump/<run id> branch, then the postscript,
#      applied statement by statement through the Management API; every failure listed.
#   3. Reference and configuration data copied from production (read only, 20 s per page): schema ref, roles, settings, catalogues, routes,
#      prompts, registers (scripts/boost-rebuild.py DATA_TABLES). No catalogue rows, no customer data.
#   4. Production's migrations newer than the dump (version above dump_head), read only from production; cron jobs on the TEST project are
#      switched off after each.
#   5. G3 (75 functions, 48 relations, no drift), then sql/boost-ingestion 001 and 002 and the rolled-back 005 (point 3, the 50-item
#      shadow-only check, the rehearsal).
#   6. Results to the never-merged branch boost-test/<run id> (counts, names and error messages only).
# Nothing is written to production: every production call is a Management API query with read_only=true.
name: Boost test project rebuild
on:
  workflow_dispatch:
    inputs:
      test_project_ref:
        description: "Ref of the throwaway project named coursefinder-boost-test"
        required: true
        default: "ucdaaqrpgcldnatavmib"
      dump_branch:
        description: "Pilot branch holding the production schema dump (db-schema-dump/<run id>)"
        required: true
      dump_head:
        description: "Production migration head when the dump was taken (14 digits); newer migrations are applied after the dump"
        required: true
      extra_versions:
        description: "Comma-separated versions below dump_head that reached production after the dump (blank = none)"
        required: false
        default: ""
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ inputs.test_project_ref }}
      PROD: fxcwkweaxjtknorudmwp
      DUMP_BRANCH: ${{ inputs.dump_branch }}
      DUMP_HEAD: ${{ inputs.dump_head }}
      EXTRA_VERSIONS: ${{ inputs.extra_versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Pilot baseline files and the production schema dump (public repository)
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set on this repository"; exit 1; fi
          if ! [[ "$DUMP_BRANCH" =~ ^db-schema-dump/[0-9]+$ ]] || ! [[ "$DUMP_HEAD" =~ ^[0-9]{14}$ ]]; then echo "::error::dump_branch must be db-schema-dump/<run id> and dump_head 14 digits"; exit 1; fi
          git clone -q --depth 1 https://github.com/msinghbs-ai/Coursefinder-Pilot.git pilot
          git clone -q --depth 1 -b "$DUMP_BRANCH" https://github.com/msinghbs-ai/Coursefinder-Pilot.git dump
          (cd dump/supabase/live-capture/baseline && md5sum -c MD5SUMS)
          echo "Dump: $DUMP_BRANCH ($(wc -c < dump/supabase/live-capture/baseline/schema.sql) bytes); head $DUMP_HEAD" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 1. Reset the throwaway test project
        run: python3 scripts/boost-rebuild.py reset | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 2. Schema from the dump
        run: |
          python3 scripts/boost-rebuild.py schema pilot/supabase/live-capture/baseline/roles-apply.sql | tee -a "$GITHUB_STEP_SUMMARY"
          cat pilot/supabase/live-capture/baseline/apply-preamble.sql dump/supabase/live-capture/baseline/schema.sql pilot/supabase/live-capture/baseline/apply-postscript.sql > schema-full.sql
          python3 scripts/boost-rebuild.py schema schema-full.sql | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 3. Reference and configuration data (read only from production)
        run: python3 scripts/boost-rebuild.py data | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 4. Migrations newer than the dump (read only from production)
        run: python3 scripts/boost-rebuild.py newer "$DUMP_HEAD" "$EXTRA_VERSIONS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 5. G3, point 3 and the 50-item shadow-only check
        run: |
          python3 scripts/boost-rebuild.py g3 | tee -a "$GITHUB_STEP_SUMMARY"
          for f in 001_boost_inbound_staging.sql 002_boost_promote.sql 005_rehearsal_rolled_back.sql; do
            python3 scripts/boost-rebuild.py sqlfile "sql/boost-ingestion/$f" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY" out/verdict.txt
          import json
          g = json.load(open("out/g3.json")).get("g3") or {}
          r = json.load(open("out/sql-005_rehearsal_rolled_back.sql.json")).get("rehearsal") or {}
          checks = {
            "g3": g.get("drift") == [] and g.get("functions") == 75 and g.get("relations") == 48,
            "bulk_1000_under_5s": bool(r.get("bulk_1000", {}).get("under_5s")),
            "shadow_50_none_admitted": r.get("shadow_50", {}).get("result", {}).get("by_state", {}).get("admitted", 0) == 0 and r.get("shadow_50", {}).get("courses_changed") == 0,
            "rehearsal_1_written_0_touched": r.get("study_load_written") == 1 and r.get("updated_at_touched") == 0,
            "outside_window_refused": r.get("outside_window") == "refused"}
          print(json.dumps(checks)); print("PASS" if all(checks.values()) else "FAIL")
          PY
      - name: Results to boost-test/<run id>
        if: ${{ !cancelled() }}
        run: |
          if [ ! -d out ] || [ -z "$(ls -A out 2>/dev/null)" ]; then echo "No results to keep" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="boost-test/${{ github.run_id }}"
          rm -rf pilot dump schema-full.sql
          mkdir -p boost-test && cp -r out/* boost-test/
          git checkout -q -b "$branch"; git add -A boost-test
          git commit -q -m "Boost test project rebuild results (run ${{ github.run_id }}, dump $DUMP_BRANCH, target $REF)"
          git push -q origin "$branch"
          echo "Results branch: $branch" | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q FAIL out/verdict.txt 2>/dev/null || [ ! -f out/verdict.txt ]; then exit 1; fi
