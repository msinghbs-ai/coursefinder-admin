name: CF-092 governance closure reconciliation
on: [push]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.ref == 'refs/heads/change/cf-20260910-092-scheduled-jobs-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Carry forward governed CF-092 files
        run: |
          git fetch origin change/cf-20260910-092-scheduled-jobs-config
          mkdir -p change-control/30-admin-pim-ux
          git show origin/change/cf-20260910-092-scheduled-jobs-config:change-control/30-admin-pim-ux/CF-CHG-20260910-092-scheduled-jobs-config-controls.md > change-control/30-admin-pim-ux/CF-CHG-20260910-092-scheduled-jobs-config-controls.md
          git show origin/change/cf-20260910-092-scheduled-jobs-config:docs/coursefinder-admin-navigation-information-architecture-v1.6.md > docs/coursefinder-admin-navigation-information-architecture-v1.6.md
      - name: Reconcile closure and continuity
        run: python .github/scripts/cf092_governance_closure.py
      - name: Commit reconciled governance state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/cf092-governance-closure.yml .github/scripts/cf092_governance_closure.py
          git add -A
          git commit -m 'CF-092 close Scheduled Tasks governance and continuity'
          git push origin HEAD:change/cf-20260910-092-scheduled-jobs-closure
