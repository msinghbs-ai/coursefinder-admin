name: CF-093 Release Governance Sync

on:
  push:
    branches:
      - m245/scheduled-workflow-orchestrator-20260910
    paths:
      - '.github/workflows/cf093-release-gov-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m245/scheduled-workflow-orchestrator-20260910
      - name: Record exact release gate state
        shell: python
        run: |
          from pathlib import Path
          cc=Path('change-control/30-admin-pim-ux/CF-CHG-20260910-093-scheduled-workflow-orchestrator.md')
          s=cc.read_text()
          s=s.replace('**Updated:** 2026-09-11 11:31 AEST  ', '**Updated:** 2026-09-11 11:37 AEST', 1)
          old='Until PR #68 passes and merges, **v2.15.76 remains the accepted visible release** even though CF-093 functional code is deployed on Pilot main.'
          new='PR #68 exact corrective head `2efcda307bc6fee5b8d626878468151d0b42989d` now has canonical v2.15.77 synchronised across `src/release-currentness-entry.js`, `src/pim-version-entry.js`, `src/mature-main.jsx`, `index.html` and the maintained release-history contract while retaining v2.15.76/v2.15.75 history. Release History Contract `34551291580` PASS and Pilot Frontend Build `34551291667` PASS. Codex P1 release-metadata finding on reviewed head `26eaffd1cf` was corrected and resolved; exact-head Codex re-review was requested in PR comment `5628088682`. **Do not merge PR #68 until that exact-head review is clean.** Until merge/deployed-currentness acceptance completes, v2.15.76 remains the accepted visible main release.'
          assert old in s
          cc.write_text(s.replace(old,new,1))

          nxt=Path('project-runsheets/milestone-2/m2.4/m2.4.5/NEXT-CHAT.md')
          s=nxt.read_text()
          marker='## Current exact pickup — CF-093 Scheduled Workflow Orchestrator — 11 September 2026\n\n'
          note='- Functional PR #67 is merged on Pilot main at `912572203e4f53ac081617b0ea567c9298cab84d`; post-merge Release History `34550482710`, Frontend Build `34550482729`, and deployed UAT `34550482733` all PASS.\n- Release-currentness PR #68 is now the active gate. Exact head `2efcda307bc6fee5b8d626878468151d0b42989d` synchronises v2.15.77 across currentness, canonical retained history, shell UI version, HTML title and the maintained contract. Release History `34551291580` PASS; Frontend Build `34551291667` PASS.\n- Codex P1 on the earlier PR #68 head `26eaffd1cf` was addressed; exact-head re-review requested in comment `5628088682`. Do not merge until that review is clean.\n- CF-093 remains OPEN for the separate server-authorised scope/target builder, processing-mode selection, consequential run preview and true bounded new-run/schedule construction. Do not claim full orchestrator closure.\n'
          if marker in s:
              start=s.index(marker)+len(marker)
              end=s.find('\n## Immediate next decision rule',start)
              if end!=-1:
                  s=s[:start]+note+s[end:]
          nxt.write_text(s)

          acc=Path('project-runsheets/milestone-2/m2.4/m2.4.5/CF-093-ACCEPTANCE.md')
          s=acc.read_text()
          s=s.replace('**Status:** TARGETED ACCEPTANCE ACTIVE — CODEX RE-REVIEW PENDING','**Status:** FUNCTIONAL ACCEPTANCE PASS — v2.15.77 RELEASE RE-REVIEW PENDING',1)
          block='\n\n## 11 Sep 2026 release-currentness gate\n\n- Functional PR #67 merged: `912572203e4f53ac081617b0ea567c9298cab84d`.\n- Post-merge deployed UAT `34550482733`: PASS.\n- PR #68 exact release head: `2efcda307bc6fee5b8d626878468151d0b42989d`.\n- Release History Contract `34551291580`: PASS.\n- Pilot Frontend Build `34551291667`: PASS.\n- Codex P1 canonical-release synchronization finding corrected; exact-head re-review requested in comment `5628088682`.\n- Merge remains HOLD until exact-head Codex review is clean, followed by nominated deployed-currentness verification.\n- Separate target-builder / processing-mode / run-preview orchestrator scope remains OPEN and is not part of this release-currentness merge.\n'
          if '## 11 Sep 2026 release-currentness gate' not in s:
              s += block
          acc.write_text(s)

          Path('.github/workflows/cf093-release-gov-sync.yml').unlink()
      - name: Commit governance reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "CF-093 record v2.15.77 release gate evidence"
          git push origin HEAD:m245/scheduled-workflow-orchestrator-20260910
