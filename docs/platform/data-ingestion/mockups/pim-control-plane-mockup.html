<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudySearch PIM Admin: control-plane mockup (design only)</title>
<style>
:root{--nav:#0f172a;--nav2:#1e293b;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--acc:#4f46e5;--acc2:#eef2ff;
--ok:#15803d;--okb:#dcfce7;--warn:#a16207;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--info:#0369a1;--infob:#e0f2fe;--hold:#6d28d9;--holdb:#ede9fe;--grey:#475569;--greyb:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,select,input{font:inherit}h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 4px}h3{font-size:14px;margin:0 0 6px}
p{margin:0 0 8px}.mut{color:var(--mut)}.sm{font-size:12px}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
nav{background:var(--nav);color:#cbd5e1;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;border-bottom:1px solid var(--nav2);margin-bottom:8px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--acc);color:#fff;font-weight:700;display:grid;place-items:center}
.brand b{color:#fff;display:block}.grp{font-size:11px;letter-spacing:.09em;color:#64748b;margin:14px 8px 4px;font-weight:700}
nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:#cbd5e1;text-decoration:none;cursor:pointer}
nav a:hover{background:var(--nav2)}nav a.on{background:#312e81;color:#fff}nav a.off{color:#475569;cursor:default}nav a.off:hover{background:none}
nav a .dot{width:7px;height:7px;border-radius:50%;background:#818cf8}
main{padding:0 26px 60px;min-width:0}.banner{background:#fef9c3;border-bottom:1px solid #fde047;margin:0 -26px 14px;padding:7px 26px;font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}.crumb{font-size:12px;color:var(--mut)}
.role{display:flex;gap:8px;align-items:center}.role select{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--mut);cursor:pointer;font-weight:600}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;overflow-x:auto}
.row{display:grid;gap:14px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c32{grid-template-columns:3fr 2fr}
.kpi b{font-size:22px;display:block}.kpi span{font-size:12px;color:var(--mut)}
table{border-collapse:collapse;width:100%}th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:top}tr.click{cursor:pointer}tr.click:hover{background:#f8fafc}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--warnb);color:var(--warn)}.bad{background:var(--badb);color:var(--bad)}
.info{background:var(--infob);color:var(--info)}.hold{background:var(--holdb);color:var(--hold)}.grey{background:var(--greyb);color:var(--grey)}
.tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;letter-spacing:.04em;vertical-align:middle}
.t-ex{background:#e2e8f0;color:#334155}.t-xt{background:#dbeafe;color:#1d4ed8}.t-pr{background:#fae8ff;color:#a21caf}.t-s{background:#fef9c3;color:#854d0e}.t-l{background:#dcfce7;color:#166534}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}.btn:hover{background:#f8fafc}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:#4338ca}.btn[disabled]{opacity:.45;cursor:not-allowed}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:#e2e8f0;min-width:90px}.bar i{display:block;height:100%}
.s-f{background:#16a34a}.s-p{background:#38bdf8}.s-st{background:#f59e0b}.s-n{background:#64748b}.s-h{background:#8b5cf6}.s-u{background:#e2e8f0}
.cell{cursor:pointer;border-radius:8px;padding:6px 8px}.cell:hover{background:#f8fafc;outline:1px solid var(--line)}.cell b{font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc2);color:var(--acc)}
.drawer{position:fixed;top:0;right:0;width:min(560px,96vw);height:100vh;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(15,23,42,.14);padding:18px 20px;overflow:auto;z-index:20}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:30}.modal>div{background:#fff;border-radius:14px;padding:20px;width:min(520px,94vw)}
.modal textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.steps button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:600;color:var(--mut)}
.steps button.on{border-color:var(--acc);color:var(--acc);background:var(--acc2)}.steps button.done{color:var(--ok)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:5px 12px}.kv dt{color:var(--mut)}.kv dd{margin:0}
pre{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px 12px;white-space:pre-wrap;font:12px/1.5 ui-monospace,Consolas,monospace;margin:0;max-height:280px;overflow:auto}
pre del{color:#64748b;text-decoration:line-through}pre mark{background:#365314;color:#ecfccb}
.q{border-left:3px solid var(--acc);background:#f8fafc;padding:6px 10px;margin:6px 0;font-style:italic}
.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side>div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}label.f input,label.f select{display:block;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-top:3px}
.meter{height:8px;border-radius:5px;background:#e2e8f0;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc)}
ul.t{margin:4px 0 8px 18px;padding:0}.hide{display:none!important}.right{text-align:right}.nowrap{white-space:nowrap}
@media (max-width:900px){.app{grid-template-columns:1fr}nav{position:static;height:auto}.c2,.c3,.c4,.c32,.side{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main>
  <div class="banner"><b>Design mockup, not the live system.</b>
    <span><span class="tag t-l">LIVE READ</span> figure read from the platform or its registers on the date shown</span>
    <span><span class="tag t-s">SAMPLE</span> illustrative value</span>
    <span><span class="tag t-ex">EXISTING</span> <span class="tag t-xt">EXTENDED</span> <span class="tag t-pr">PROPOSED</span> control status</span></div>
  <div class="top"><div><div class="crumb" id="crumb"></div><h1 id="title"></h1><div class="mut" id="sub"></div></div>
    <div class="role"><span class="sm mut">Viewing as</span><select id="role"></select></div></div>
  <div id="page"></div>
</main>
</div>
<div id="overlay"></div>
<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s), h=(s)=>s;
const ROLES=["Viewer","Counsellor","Curator","Pipeline Operator","PIM Admin","Platform Admin"];
let role=6, page="layer2", tab={}, audit=[];
const T={ex:'<span class="tag t-ex">EXISTING</span>',xt:'<span class="tag t-xt">EXTENDED</span>',pr:'<span class="tag t-pr">PROPOSED</span>',s:'<span class="tag t-s">SAMPLE</span>',l:'<span class="tag t-l">LIVE READ 25 NOV</span>'};
const pill=(t,c)=>`<span class="pill ${c}">${t}</span>`;
const can=(r)=>role>=r;
const gate=(r,html)=>can(r)?html:html.replace('<button','<button disabled title="Needs '+ROLES[r-1]+' or above"');

/* ---------- navigation: the existing menu (docs/UI-MAP.md, release 2.17.0) ---------- */
const NAV=[["OVERVIEW",[["dashboard","Dashboard",1,0]]],
["CATALOGUE",[["courses","Courses",1,1],["providers","Providers",1,0],["contacts","Provider contacts",1,0],["scholarships","Scholarships",1,0],["entry","Entry requirements",1,0],["rankings","Rankings & statistics",1,0],["destination","Destination data",3,0],["reference","Reference data",3,0]]],
["DATA PIPELINE",[["coverage","Coverage & completeness",1,0],["layer1","Layer 1 Register",3,1],["layer2","Layer 2/3 Build & enrich",3,1],["layer4","Layer 4 Review",3,1]]],
["DATA & GOVERNANCE",[["governance","Human Edits & Periodic Audit",4,0]]],
["OPERATIONS",[["health","Platform health",3,0],["jobs","Scheduled jobs",4,1],["evidence","Evidence",3,0]]],
["PLATFORM SETTINGS",[["environment","Settings",4,0],["services","Models & services",3,1],["migration","Go-live checklist",6,0]]],
["ADMINISTRATION",[["users","Users & roles",6,0]]],
["GUIDES",[["guide","Guides",1,1]]],
["ABOUT THIS MOCKUP",[["map","Screen and route mapping",1,1]]]];
function drawNav(){
  $("#nav").innerHTML=`<div class="brand"><div class="logo">SS</div><div><b>StudySearch</b><span class="sm">PIM Admin · mockup</span></div></div>`+
  NAV.map(([g,items])=>{const vis=items.filter(i=>role>=i[2]); if(!vis.length)return"";
    return `<div class="grp">${g}</div>`+vis.map(([k,l,r,m])=>m?`<a class="${page===k?"on":""}" data-p="${k}"><span>${l}</span><span class="dot" title="Changed in this design"></span></a>`:`<a class="off" title="Unchanged by this design"><span>${l}</span></a>`).join("")}).join("");
  $("#nav").querySelectorAll("a[data-p]").forEach(a=>a.onclick=()=>go(a.dataset.p));
}
function go(p,t){page=p;if(t)tab[p]=t;closeAll();draw()}
function head(c,t,s){$("#crumb").textContent=c;$("#title").textContent=t;$("#sub").innerHTML=s}
function tabs(p,list){const cur=tab[p]||list[0][0];return `<div class="tabs">`+list.map(([k,l,tg])=>`<button class="${cur===k?"on":""}" data-t="${k}">${l} ${tg||""}</button>`).join("")+`</div>`}
function bindTabs(p){document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab[p]=b.dataset.t;draw()})}
function closeAll(){$("#overlay").innerHTML=""}
function drawer(html){$("#overlay").innerHTML=`<div class="drawer"><div style="display:flex;justify-content:flex-end"><button class="btn" id="x">Close</button></div>${html}</div>`;$("#x").onclick=closeAll}
function confirmBox(title,body,minRole,done){
  $("#overlay").innerHTML=`<div class="modal"><div><h2>${title}</h2><div class="mut" style="margin:6px 0 10px">${body}</div>
  <label class="f">Reason (required, kept in the audit log)<textarea id="why"></textarea></label>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="no">Cancel</button><button class="btn pri" id="yes">Confirm</button></div>
  <div class="sm mut" style="margin-top:8px">Needs ${ROLES[minRole-1]} or above. Nothing is changed in this mockup.</div></div></div>`;
  $("#no").onclick=closeAll;$("#yes").onclick=()=>{const w=$("#why").value.trim();if(w.length<8){$("#why").style.borderColor="#ef4444";return}
    audit.unshift({t:new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"}),who:ROLES[role-1],what:title,why:w});closeAll();done&&done();draw()}
}
const auditCard=()=>`<div class="card"><h3>Audit history ${T.ex} <span class="sm mut">pipeline.admin_control_events</span></h3>`+(audit.length?`<table><tr><th>Time</th><th>Who</th><th>Action</th><th>Reason</th></tr>`+audit.map(a=>`<tr><td>${a.t}</td><td>${a.who}</td><td>${a.what}</td><td>${a.why}</td></tr>`).join("")+`</table>`:`<span class="mut">No actions taken in this session. Confirm any action in the mockup to see its audit line here.</span>`)+`</div>`;

/* ---------- A. Global data delivery: inside the existing Data Delivery component (Layer 2/3 › Operations) ---------- */
/* outcome mix per cell: verified, stale, partial, evidenced no-source, protected hold; remainder = unknown */
const DOM=["Academic entry","English","Scholarships","Tuition fees","Intakes","Descriptions","Course links","Campuses","Rankings","Destination rules"];
const CTRY=["Australia","New Zealand","Canada"];
const LIVE={"Australia|Academic entry":37.8,"New Zealand|Academic entry":15.0,"Canada|Academic entry":4.0,"Australia|Scholarships":43.4,"New Zealand|Scholarships":32.2,"Canada|Scholarships":47.2};
const ALL={"Academic entry":30.1,"English":59.2,"Scholarships":41.8,"Intakes":8.8,"Descriptions":44.5,"Course links":66.8,"Campuses":83.1};
function mix(c,d){const live=LIVE[c+"|"+d];const seed=(c.length*7+d.length*13)%17;const f=live!=null?live:Math.max(6,Math.min(92,(ALL[d]||55)+seed-8));
  const st=Math.round(f*.06),pa=Math.round((100-f)*.2),n=Math.round((100-f)*.14),hd=Math.round((100-f)*.08);return {f,st,pa,n,hd,live:live!=null}}
let measure="canonical", drill=null, dv="delivery";
const MEAS={canonical:["Verified canonical","Verified applicable field instances ÷ applicable field instances"],published:["Consumer coverage","Canonical values that also pass the consumer read-back"],fresh:["Fresh","Verified values still inside the field's refresh window"],accounted:["Accounted for","Verified, evidenced no-source or protected hold ÷ applicable. Partial and unknown are not accounted for"]};
function cellVal(m){return measure==="canonical"?m.f:measure==="published"?m.f*.93:measure==="fresh"?m.f-m.st:Math.min(100,m.f+m.n+m.hd)}
function pLayer2(){
  head("Home / Data pipeline / Layer 2/3 Build & enrich","Layer 2/3 Build & enrich","Operations opens with the existing Data Delivery panel. The matrix, requests and refresh views extend that panel; nothing is added to Coverage & completeness.");
  const t=tab.layer2||"operations";
  let out=tabs("layer2",[["operations","Operations",T.xt],["universities","Universities",T.ex],["enrich","Enrich fields",T.ex],["plan","Enrichment plan",T.ex],["builder","Adapter builder",T.ex],["sources","Course sources",T.ex],["flags","Flags",T.ex],["scholarships","Scholarships",T.ex]]);
  if(t!=="operations")out+=`<div class="card"><h2>${{universities:"Universities",enrich:"Enrich fields",plan:"Enrichment plan",builder:"Adapter builder",sources:"Course sources",flags:"Flags",scholarships:"Scholarships"}[t]} ${T.ex}</h2><p class="mut">Unchanged. ${t==="plan"?"The enrichment planner stays the one planner; it gains an academic entry step and typed outcomes.":""}</p></div>`;
  else{
   out+=`<div class="card" style="padding:10px 16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><b>Data Delivery</b> ${T.xt} <span class="sm mut">existing component <code>DataDelivery.jsx</code>, read <code>admin_layer23</code></span></div>
     <div class="seg" id="dv">${[["delivery","Delivery matrix"],["requests","Requests & feedback"],["refresh","Refresh & maintenance"]].map(([k,l])=>`<button data-dv="${k}" class="${dv===k?"on":""}">${l}</button>`).join("")}</div></div></div>`;
   if(dv==="delivery"){
    out+=`<div class="row c4">
      <div class="card kpi"><b>36,052</b><span>active courses · 1,886 providers ${T.l}</span></div>
      <div class="card kpi"><b>+380</b><span>courses gained an admitted entry requirement since the last snapshot ${T.l}</span></div>
      <div class="card kpi"><b>1,204</b><span>published scholarship awards, 136 providers ${T.l}</span></div>
      <div class="card kpi"><b>US$0.88</b><span>AI spend today on the key; daily ceiling US$5.00 ${T.l}</span></div></div>
    <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
      <div><h2>Country and domain matrix ${T.xt}</h2><div class="sm mut">${MEAS[measure][1]}. Applicability is decided per field and entity (course, award, provider or country edition). Click a cell to drill down.</div></div>
      <div class="seg" id="meas">${Object.keys(MEAS).map(k=>`<button data-m="${k}" class="${measure===k?"on":""}">${MEAS[k][0]}</button>`).join("")}</div></div>
      <div style="overflow:auto"><table><tr><th>Domain</th><th>Grain</th>${CTRY.map(c=>`<th>${c}</th>`).join("")}<th>Open requests</th><th>Next automatic action</th></tr>`+
      DOM.map((d,i)=>`<tr><td><b>${d}</b></td><td class="sm mut">${["Course × student country","Course × test","Award × course","Course × year","Course × intake","Course","Course","Course × campus","Provider × edition","Country × edition"][i]}</td>`+CTRY.map(c=>{const m=mix(c,d),v=cellVal(m);return `<td><div class="cell" data-c="${c}" data-d="${d}"><b>${v.toFixed(1)}%</b> ${m.live&&measure==="canonical"?T.l:T.s}
        <div class="bar" title="verified ${(m.f-m.st).toFixed(0)} · stale ${m.st} · partial ${m.pa} · no source ${m.n} · held ${m.hd}"><i class="s-f" style="width:${m.f-m.st}%"></i><i class="s-st" style="width:${m.st}%"></i><i class="s-p" style="width:${m.pa}%"></i><i class="s-n" style="width:${m.n}%"></i><i class="s-h" style="width:${m.hd}%"></i></div></div></td>`}).join("")+
        `<td>${[3,2,4,1,2,1,0,1,2,7][i]} ${T.s}</td><td class="sm">${["Read stored course pages with the entry reader","Rendered fetch where the stored copy lacks the section","Read award pages","Re-read on a new fee year","Read academic calendars","Describe from the bound course page","Search for the official course page","Bind campus from the register","Wait for the next edition","Confirm on the official site"][i]}</td></tr>`).join("")+`</table></div>
      <div class="legend" style="margin-top:10px"><span><i class="s-f"></i>Verified</span><span><i class="s-st"></i>Stale (verified, past its refresh window)</span><span><i class="s-p"></i>Partial (some of the required parts)</span><span><i class="s-n"></i>No source (evidenced)</span><span><i class="s-h"></i>Protected hold</span><span><i class="s-u"></i>Unknown (not yet established)</span></div>
      <div class="sm mut" style="margin-top:8px">Live cells: academic entry and scholarship coverage by country from the reader-status trackers, 25 Nov. Other cells and the outcome mix are samples until the typed outcome exists. Queued, running and failed work is shown on Scheduled jobs, not here.</div></div>
    <div class="row c2"><div class="card"><h2>Next executable actions ${T.xt}</h2><div class="sm mut">From the existing enrichment plans and standing gap queue.</div>
      <table><tr><th>Action</th><th>Scope</th><th>Method</th><th>State</th></tr>
      <tr><td>Read entry requirements</td><td>1,563 courses, 297 providers ${T.l}</td><td>Stored copy, $0</td><td>${pill("Ready","info")}</td></tr>
      <tr><td>Decide scholarship scope cards</td><td>78 providers ${T.l}</td><td>Person, Layer 4</td><td>${pill("Needs a person","warn")}</td></tr>
      <tr><td>Find the official entry page</td><td>1,655 providers ${T.l}</td><td>Link crawl, $0</td><td>${pill("Ready","info")}</td></tr>
      <tr><td>Rendered fetch, collapsed sections</td><td>about 2,400 pages (estimate)</td><td>Firecrawl, scheduled budget</td><td>${pill("Ready inside the budget","info")}</td></tr></table></div>
     <div class="card"><h2>Actual gains ${T.xt}</h2><div class="sm mut">Canonical and published rows only. Proposed rows and finished jobs are not gains.</div>
      <table><tr><th>Domain</th><th class="right">Canonical 24 h</th><th class="right">Published 24 h</th><th class="right">7 days</th></tr>
      <tr><td>Academic entry</td><td class="right">+380 ${T.l}</td><td class="right">+352 ${T.s}</td><td class="right">+1,140 ${T.s}</td></tr>
      <tr><td>Scholarships</td><td class="right">+4 ${T.l}</td><td class="right">+4 ${T.l}</td><td class="right">+64 ${T.s}</td></tr>
      <tr><td>Descriptions</td><td class="right">+72 ${T.s}</td><td class="right">+72 ${T.s}</td><td class="right">+1,343 ${T.s}</td></tr></table></div></div>`;
    if(drill)out+=drillCard();
   }
   if(dv==="requests")out+=pRequests();
   if(dv==="refresh")out+=pRefresh();
  }
  $("#page").innerHTML=out;bindTabs("layer2");
  document.querySelectorAll("#dv button").forEach(b=>b.onclick=()=>{dv=b.dataset.dv;draw()});
  document.querySelectorAll("#meas button").forEach(b=>b.onclick=()=>{measure=b.dataset.m;draw()});
  document.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{drill={c:c.dataset.c,d:c.dataset.d,lvl:0};draw();$("#drill").scrollIntoView({behavior:"smooth"})});
  bindDrill();bindReq();
}
function drillCard(){const {c,d,lvl}=drill;
  const prov=[["EQUALS International",21,9,"Read stored pages"],["Charles Darwin University",312,188,"Layer 4 card waiting"],["Griffith College, QIBT",44,12,"Find official page"],["Ara Institute of Canterbury",86,3,"Held: site blocked"]];
  let b=`<div class="card" id="drill"><div class="crumb"><a href="#" data-l="-1">Matrix</a> › <a href="#" data-l="0">${c} · ${d}</a>${lvl>0?` › <a href="#" data-l="1">EQUALS International</a>`:""}${lvl>1?` › Advanced Diploma of Nursing`:""}</div>`;

const PAGES={layer2:pLayer2,layer1:pLayer1,courses:pCourses,jobs:pJobs,services:pServices,layer4:pLayer4,guide:pGuide,map:pMap,dashboard:pDash};

draw();
